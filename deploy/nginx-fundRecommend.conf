# ============================================================
# 求一基 · 子路径反代配置
# 目标线上地址：https://www.luliming.xyz/fundRecommend
# 应用本地监听：http://127.0.0.1:3220
# 说明：nginx 把 /fundRecommend/ 前缀剥离后转发给 Node 应用，
#      因此前端相对的 api/* 与静态资源都能正确解析为
#      /fundRecommend/api/* 与 /fundRecommend/style.css 等。
# ============================================================

# 无末尾斜杠时，先 301 补上斜杠，避免静态资源相对路径错乱
location = /fundRecommend {
    return 301 /fundRecommend/;
}

location /fundRecommend/ {
    # 末尾斜杠关键：剥离 /fundRecommend 前缀
    proxy_pass http://127.0.0.1:3220/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长轮询 / 大模型生成可能较慢，放宽超时
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
}
