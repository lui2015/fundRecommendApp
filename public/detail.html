<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>基金详情 · 求一基</title>
<link rel="stylesheet" href="style.css?v=2026080716"/>
<style>
  .detail-page {
    min-height: 100vh; background: var(--bg); color: var(--text);
    padding-bottom: 48px;
  }
  /* 顶部导航 */
  .detail-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(7,7,13,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: var(--text2); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s; flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--red); color: var(--red); }
  .nav-title { font-size: 15px; font-weight: 700; color: var(--text2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 内容区 */
  .detail-wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 0; }

  /* 基金头部卡片 */
  .detail-header { text-align: center; padding: 28px 20px 24px; }
  .dh-tags { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .dh-tag {
    font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    letter-spacing: .5px;
  }
  .dh-tag-blind { background: rgba(230,57,70,.14); color: var(--red); border: 1px solid rgba(230,57,70,.25); }
  .dh-tag-type { background: rgba(240,193,75,.1); color: var(--gold); border: 1px solid rgba(240,193,75,.22); }
  .dh-tag-warn { background: rgba(240,193,75,.08); color: #c9a03a; border: 1px solid rgba(201,160,58,.25); }
  .dh-name { font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
  .dh-code { font-size: 13px; color: var(--text3); margin-bottom: 16px; }
  .dh-opening { font-size: 15px; color: var(--text2); line-height: 1.5; margin-bottom: 8px; }
  .dh-oneliner { font-size: 17px; font-weight: 700; color: var(--red); line-height: 1.5; }

  /* 区块 */
  .detail-section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .section-title {
    font-size: 15px; font-weight: 800; color: var(--text);
    border-left: 3px solid var(--red); padding-left: 10px;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .section-title .num {
    font-size: 12px; color: var(--red); font-weight: 400;
  }

  /* 指标表 */
  .metrics-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .metrics-table td {
    padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .metrics-table td:first-child { color: var(--text3); width: 46%; }
  .metrics-table tr:last-child td { border-bottom: none; }
  .val-pos { color: var(--red); font-weight: 700; }
  .val-neg { color: #2ecc71; font-weight: 700; }

  /* 图表容器 */
  .chart-wrap { overflow-x: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }
  .chart-wrap svg { min-width: 100%; }

  /* 分析文案 */
  .reason-block { margin-bottom: 18px; }
  .reason-block:last-child { margin-bottom: 0; }
  .reason-block h3 {
    font-size: 14px; font-weight: 800; color: var(--gold);
    margin-bottom: 8px;
  }
  .reason-block ul { list-style: none; padding: 0; margin: 0; }
  .reason-block li {
    font-size: 13px; color: var(--text2); line-height: 1.65;
    padding: 4px 0 4px 18px; position: relative;
  }
  .reason-block li::before {
    content: '•'; position: absolute; left: 4px; color: var(--text3);
  }
  .reason-block p { font-size: 13px; color: var(--text2); line-height: 1.65; margin: 4px 0; }
  .reason-label { font-size: 12px; color: var(--text3); margin-top: 8px; }

  /* 底部操作栏 */
  .detail-actions {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .d-action-btn {
    flex: 1; height: 44px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all .2s; display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .d-action-ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--text2);
  }
  .d-action-ghost:hover { border-color: var(--text3); color: var(--text); }
  .d-action-primary {
    background: linear-gradient(135deg, var(--red), #c0392b);
    color: #fff; box-shadow: 0 4px 16px rgba(230,57,70,.3);
  }
  .d-action-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(230,57,70,.4); }

  /* 免责声明 */
  .disclaimer {
    font-size: 11px; color: var(--text3); line-height: 1.6;
    border-top: 1px dashed rgba(255,255,255,.08);
    margin-top: 20px; padding-top: 14px;
  }

  /* 基金经理卡片 */
  .mgr-list { display: flex; flex-direction: column; gap: 10px; }
  .mgr-card {
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px; padding: 12px 14px;
  }
  .mgr-name { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .mgr-meta { font-size: 12px; color: var(--text3); line-height: 1.7; }

  /* 资产/行业配置条形 */
  .asset-list { display: flex; flex-direction: column; gap: 8px; }
  .asset-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .asset-label {
    width: 72px; flex-shrink: 0; color: var(--text2); text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .asset-bar-wrap {
    flex: 1; height: 18px; background: rgba(255,255,255,.04);
    border-radius: 4px; overflow: hidden; position: relative;
  }
  .asset-bar {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--red), #c0392b); opacity:.85;
    transition: width .5s ease;
  }
  .ind-bar {
    background: linear-gradient(90deg, var(--gold), #c9a03a); opacity:.85;
  }
  .asset-pct { width: 48px; flex-shrink: 0; text-align: right; color: var(--text2); font-weight: 700; }

  /* 持仓表 */
  .hold-table th { color: var(--text3); font-size: 11px; font-weight: 600; text-align: left; padding-bottom: 6px; }
  .hold-code { color: var(--text3); font-family: var(--font-mono); font-size: 12px; }

  /* 无数据兜底 */
  .no-data { text-align: center; padding: 40px 0; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>
<div class="detail-page">
  <!-- 导航 -->
  <nav class="detail-nav">
    <button class="back-btn" id="backBtn" aria-label="返回">←</button>
    <span class="nav-title" id="navTitle">基金详情</span>
  </nav>

  <div class="detail-wrap" id="detailContent">
    <div class="no-data">加载中…</div>
  </div>
</div>

<script src="detail.js?v=2026080718"></script>
</body>
</html>
