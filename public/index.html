<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>求一基 · 趣味抽签基金推荐</title>
  <link rel="stylesheet" href="style.css?v=2026080712" />
</head>
<body>
  <!-- 科幻背景层 -->
  <div class="bg-layer">
    <div class="grid-bg"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="scanline"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="app">
    <!-- 顶栏 -->
    <header class="topbar reveal">
      <span class="brand" data-text="求一基">求一基</span>
      <button class="menu-btn" id="menuBtn" aria-label="菜单">&#9776;</button>
    </header>

    <!-- 主标语 -->
    <div class="slogan reveal">万 一 跟 你 想 得 一 样 呢 ？</div>

    <!-- 老虎机数字显示区 -->
    <section class="slot-machine reveal">
      <div class="led-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="slot-label">FUND CODE</div>
      <div class="digit-row" id="digitRow">
        <div class="digit-box"><span class="digit" data-idx="0">-</span></div>
        <div class="digit-box"><span class="digit" data-idx="1">-</span></div>
        <div class="digit-box"><span class="digit" data-idx="2">-</span></div>
        <div class="digit-box"><span class="digit" data-idx="3">-</span></div>
        <div class="digit-box"><span class="digit" data-idx="4">-</span></div>
        <div class="digit-box"><span class="digit" data-idx="5">-</span></div>
      </div>
      <div class="scan-frame"></div>
    </section>

    <!-- 结果提炼卡片 / 等待摇奖 -->
    <section class="wish-panel reveal" id="wishPanel">
      <div class="slot-status hidden" id="slotStatus">
        <div class="loading-icon-wrap">
          <span class="slot-icon">&#127922;</span>
          <span class="icon-orbit"></span>
        </div>
        <span class="status-msg" id="statusMsg">等待摇奖…</span>
        <span class="scan-bar"></span>
        <div class="loading-particles" id="loadingParticles"></div>
      </div>
      <!-- 默认态：心 想 事 成 -->
      <div class="wish-text" id="wishText"><span class="char">等</span><span class="char">待</span><span class="char">摇</span><span class="char">奖</span></div>
      <div class="idle-particles" id="idleParticles"><span class="ip"></span><span class="ip"></span><span class="ip"></span><span class="ip"></span><span class="ip"></span></div>
      <!-- 结果提炼态（抽签后显示，点击展开详情） -->
      <div class="result-summary hidden" id="resultSummary">
        <div class="summary-head">
          <div class="summary-fund-name" id="summaryFundName"></div>
          <div class="summary-code" id="summaryCode"></div>
        </div>
        <div class="summary-tags" id="summaryTags"></div>
        <div class="summary-metrics" id="summaryMetrics"></div>
        <div class="summary-oneliner" id="summaryOneliner"></div>
        <div class="summary-hint" id="summaryHint">&#128270; 点击查看完整分析</div>
      </div>
    </section>

    <!-- 许愿条件（筛选） -->
    <section class="filter-panel reveal">
      <div class="filter-title"><span class="gear">&#9881;</span> 许愿条件（可选）</div>
      <div class="filter-row">
        <select id="selType" class="cyber-select">
          <option value="">不限，全凭运气</option>
          <option value="mix" selected>混合型基金</option>
          <option value="stock">股票型基金</option>
          <option value="bond">纯债型基金</option>
          <option value="index">指数型基金</option>
        </select>
        <select id="selRisk" class="cyber-select">
          <option value="">不限风险</option>
          <option value="低">低风险</option>
          <option value="中" selected>中风险</option>
          <option value="高">高风险</option>
        </select>
      </div>
      <div class="filter-row">
        <select id="selHorizon" class="cyber-select">
          <option value="">不限持有期</option>
          <option value="短">短期 (&lt;1年)</option>
          <option value="中" selected>中期 (1-3年)</option>
          <option value="长">长期 (&gt;3年)</option>
        </select>
        <select id="selSort" class="cyber-select">
          <option value="3y" selected>近三年排序</option>
          <option value="1y">近一年排序</option>
          <option value="2y">近二年排序</option>
          <option value="5y">近五年排序</option>
        </select>
      </div>
    </section>

    <!-- 操作按钮 -->
    <section class="action-row reveal">
      <button class="draw-btn" id="drawBtn"><span class="btn-ring"></span><span class="btn-icon">&#127922;</span><span class="btn-label">摇 一 摇</span></button>
      <button class="save-btn" id="saveBtn" disabled><span class="btn-icon">&#128190;</span> 保存本次</button>
    </section>

    <!-- 免责声明 -->
    <footer class="disclaimer reveal">
      本结果由 AI 大模型生成，可能非实时/准确数据，仅供娱乐参考，不构成投资建议。
      基金有风险，投资需谨慎独立判断。
    </footer>
  </div>

  <!-- 详情弹框（Modal） -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="resultPanel">
    <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <!-- 侧边栏（更多菜单） -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title">更多</span>
      <button class="drawer-close" id="drawerClose" aria-label="关闭">&times;</button>
    </div>
    <nav class="drawer-nav">
      <a class="drawer-item active" id="menuHistory" href="#">
        <span class="drawer-icon">&#128220;</span> 抽签记录
      </a>
      <a class="drawer-item" id="menuStrategy" href="#">
        <span class="drawer-icon">&#128218;</span> 选基攻略
        <span class="drawer-badge">NEW</span>
      </a>
    </nav>
    <!-- 抽签记录内容区 -->
    <section class="drawer-section" id="drawerHistorySection">
      <div class="history-head">
        <span>&#128220; 抽签记录</span>
        <button class="refresh-btn" id="refreshHistory">&#8635;</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </aside>

  <!-- 选基攻略弹框-->
  <div class="modal-overlay" id="stgOverlay"></div>
  <div class="modal modal-lg" id="stgModal">
    <div class="stg-topbar">
      <button class="stg-back hidden" id="stgBack" aria-label="返回">&#8592;</button>
      <div class="stg-titlewrap">
        <div class="stg-title" id="stgTitle">选基攻略</div>
        <div class="stg-sub" id="stgSub">经典策略盘点· 选一套，AI 帮你落地</div>
      </div>
      <button class="modal-close stg-close" id="stgClose" aria-label="关闭">&times;</button>
    </div>

    <!-- 步骤 1：策略盘点 -->
    <div class="stg-step" id="stgStepList">
      <div class="stg-tabs" id="stgTabs"></div>
      <div class="stg-list" id="stgList"></div>
    </div>

    <!-- 步骤 2：信息补充 -->
    <div class="stg-step hidden" id="stgStepForm">
      <div class="stg-form-head">
        <div class="stg-form-name" id="stgFormName"></div>
        <div class="stg-form-tip" id="stgFormTip"></div>
      </div>
      <form class="stg-form" id="stgForm"></form>
      <div class="stg-actions">
        <button class="res-btn res-btn-ghost" type="button" id="stgFormBack">&#8592; 换个策略</button>
        <button class="res-btn res-btn-primary" type="button" id="stgSubmit">&#10024; 生成选基方案</button>
      </div>
      <div class="stg-form-note">AI 会结合真实基金数据与你的补充信息生成方案，用时约 20-40 秒。</div>
    </div>

    <!-- 步骤 3：加载中 -->
    <div class="stg-step hidden" id="stgStepLoading">
      <div class="stg-loading">
        <div class="stg-loading-ring"></div>
        <div class="stg-loading-text" id="stgLoadingText">正在按策略筛选基金…</div>
        <div class="stg-loading-steps" id="stgLoadingSteps"></div>
      </div>
    </div>

    <!-- 步骤 4：方案结果 -->
    <div class="stg-step hidden" id="stgStepResult">
      <div class="stg-result" id="stgResult"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 烟花绽放层 -->
  <canvas id="fireworks" class="fireworks-canvas"></canvas>

  <script src="app.js?v=2026080712"></script>
  <script src="strategy.js?v=2026080712"></script>
</body>
</html>
